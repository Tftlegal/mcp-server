name: CI
on:
  push:
    branches:
      #- main
      - develop
      - mcp-kali
  pull_request:
    branches:
      #- main
      - mcp-kali

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: |
          python -m flake8 . \
            --extend-exclude=dist,build,__pycache__,.mypy_cache,venv \
            --show-source \
            --statistics

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List files
        run: |
          ls -la

      - name: Import and check mcp_server
        run: |
          python -c "
          from mcp_server import mcp; print(mcp)
          "

      - name: Run system_message_generator
        run: |
          python system_message_generator.py http://localhost:8000/mcp || true
        # Чтобы юнит не падал, если сервер не жив, можно оборвать в CI без падения
